[workspace]
members = [
    "crates/wikidata-dump",
    "crates/wikidata-model",
    "crates/wikidata-filter",
    "crates/wikidata-export",
    "crates/wikidata-cli",
    "crates/bindings/wikidata-node",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.4.0"
license-file = "LICENCE.txt"
repository = "https://github.com/the-haus/wikidata-rs"
rust-version = "1.87"

[workspace.dependencies]
# Internal crates.
wikidata-dump = { path = "crates/wikidata-dump", version = "=0.4.0" }
wikidata-model = { path = "crates/wikidata-model", version = "=0.4.0" }
wikidata-filter = { path = "crates/wikidata-filter", version = "=0.4.0" }
wikidata-export = { path = "crates/wikidata-export", version = "=0.4.0" }

# External crates.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sonic-rs = "0.5"
crossbeam-channel = "0.5"
memchr = "2.7"
crc32fast = "1.4"
aho-corasick = "1"
rustc-hash = "2"
bzip2 = "0.6"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.13", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1
panic = "unwind"
